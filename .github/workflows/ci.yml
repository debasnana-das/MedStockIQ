name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://medstockiq:ci-test-password@localhost:5432/medstockiq
      AUTH_TOKEN_SECRET: ci-only-auth-test-secret-never-use-outside-this-workflow-123456789
      MEDSTOCKIQ_RUN_POSTGRES_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medstockiq
          POSTGRES_USER: medstockiq
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medstockiq -d medstockiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Verify database migration against SQLite
        run: DATABASE_URL=sqlite:///./migration_test.db alembic upgrade head
      - name: Verify database migration against PostgreSQL
        run: alembic upgrade head
      - name: Check dashboard JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/meta_controls.js
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
